<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hôm Nay Ăn Gì? — Quán Ngon Sài Gòn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface-muted: #F1F5F9;
      --text: #0F172A;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --border-hover: #CBD5E1;
      --accent: #0F172A;
      --accent-soft: #F1F5F9;
      --star: #D97706;
      --price: #047857;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* HEADER */
    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-outline {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s;
      font-family: inherit;
    }

    .btn-outline:hover {
      background: var(--surface-muted);
      border-color: var(--border-hover);
    }

    .btn-outline.active {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    .btn-solid {
      background: var(--accent);
      color: #FFFFFF;
      border: 1px solid var(--accent);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      font-family: inherit;
      transition: opacity 0.15s;
    }

    .btn-solid:hover {
      opacity: 0.9;
    }

    /* COLLAPSIBLE PANELS (RANDOM PICKER & MAP) */
    .collapse-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-top: 16px;
    }

    .collapse-panel.open {
      display: block;
    }

    .random-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .random-bar select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13.5px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
    }

    .random-result-box {
      margin-top: 12px;
      padding: 12px 14px;
      background: var(--surface-muted);
      border-radius: 8px;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    #saigonMap {
      width: 100%;
      height: 380px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    /* FILTER BAR */
    .filter-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin: 20px 0 16px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1.8fr repeat(4, 1fr);
      gap: 10px;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      padding: 9px 12px 9px 34px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13.5px;
      font-family: inherit;
      color: var(--text);
      outline: none;
    }

    .search-wrap input:focus,
    .filter-select:focus {
      border-color: var(--text-secondary);
    }

    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .filter-select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      outline: none;
      cursor: pointer;
    }

    /* DISTRICT TABS */
    .district-tabs-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .district-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid transparent;
      padding: 5px 11px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }

    .tab-btn:hover {
      background: var(--surface-muted);
      color: var(--text);
    }

    .tab-btn.active {
      background: var(--accent);
      color: #FFFFFF;
      font-weight: 600;
    }

    .results-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .reset-link {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 12.5px;
      text-decoration: underline;
      cursor: pointer;
      font-family: inherit;
    }

    /* CARDS GRID */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    .rest-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s, box-shadow 0.15s;
      cursor: pointer;
    }

    .rest-card:hover {
      border-color: var(--border-hover);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
    }

    .card-thumb {
      position: relative;
      height: 156px;
      background: var(--surface-muted);
      overflow: hidden;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-badge-area {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.82);
      color: #FFFFFF;
      font-size: 11.5px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }

    .card-badge-rating {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.95);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .card-badge-rating .star {
      color: var(--star);
    }

    .card-badge-rating small {
      font-weight: 400;
      color: var(--text-muted);
    }

    .card-content {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.35;
    }

    .card-subline {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 8px;
    }

    .card-price {
      font-weight: 600;
      color: var(--price);
    }

    .card-info {
      font-size: 12.5px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }

    .card-info-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .card-info-row span:last-child {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-dishes {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 14px;
    }

    .dish-pill {
      background: var(--surface-muted);
      color: var(--text-secondary);
      font-size: 11.5px;
      padding: 3px 8px;
      border-radius: 5px;
    }

    .card-review-summary {
      background: var(--surface-muted);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-rv-line {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .btn-card {
      background: none;
      border: none;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      padding: 2px 0;
    }

    .btn-card:hover {
      text-decoration: underline;
    }

    .btn-card-secondary {
      background: var(--surface-muted);
      border: none;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-card-secondary:hover {
      background: var(--border);
      color: var(--text);
    }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-dialog {
      background: var(--surface);
      border-radius: 14px;
      max-width: 880px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
      border: 1px solid var(--border);
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 2;
    }

    .modal-close {
      background: var(--surface-muted);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      color: var(--text-secondary);
    }

    .modal-body {
      padding: 20px;
    }

    .review-item {
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--surface-muted);
      margin-bottom: 10px;
      border-left: 3px solid #16A34A;
    }

    .review-item.bad {
      border-left-color: #DC2626;
      background: #FEF2F2;
    }

    .reviews-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .rv-col-title {
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .plat-tag {
      background: #FFFFFF;
      border: 1px solid var(--border);
      padding: 1px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .site-footer {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 20px 0;
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
    }

    @media (max-width: 900px) {
      .filter-grid {
        grid-template-columns: 1fr 1fr;
      }
      .search-wrap {
        grid-column: 1 / -1;
      }
      .reviews-two-col {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .filter-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- CLEAN HEADER -->
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <div>
          <div class="brand-title">🍜 Hôm Nay Ăn Gì?</div>
          <div class="brand-sub">341 quán ăn chọn lọc tại Bình Thạnh, Phú Nhuận, Gò Vấp, Quận 6, Bình Tân & Tân Phú</div>
        </div>
        <div class="header-actions">
          <button class="btn-outline" id="btnToggleRandom" onclick="toggleRandomPanel()">🎲 Chọn ngẫu nhiên</button>
          <button class="btn-outline" id="btnToggleMap" onclick="toggleMapPanel()">🗺️ Bản đồ</button>
        </div>
      </div>

      <!-- INLINE RANDOM PICKER (COLLAPSIBLE) -->
      <div class="collapse-panel" id="randomPanel">
        <div class="random-bar">
          <strong style="font-size:13.5px;">Hôm nay chưa biết ăn gì?</strong>
          <select id="randArea">
            <option value="all">Mọi khu vực (7 quận)</option>
            <option value="Bình Thạnh">Quận Bình Thạnh (79)</option>
            <option value="Phú Nhuận">Quận Phú Nhuận (67)</option>
            <option value="Quận 6">Quận 6 (50)</option>
            <option value="Bình Tân">Quận Bình Tân (46)</option>
            <option value="Gò Vấp">Quận Gò Vấp (40)</option>
            <option value="Tân Phú">Quận Tân Phú (40)</option>
            <option value="Gần Bình Thạnh">Gần Bình Thạnh (19)</option>
          </select>
          <select id="randBudget">
            <option value="all">Mọi mức giá</option>
            <option value="binh-dan">Bình dân (&lt; 100.000đ)</option>
            <option value="tam-trung">Tầm trung (100k – 350k)</option>
            <option value="cao-cap">Cao cấp / Buffet (&gt; 350k)</option>
          </select>
          <button class="btn-solid" onclick="spinRandomRestaurant()">Quay chọn quán</button>
        </div>
        <div id="randomResult" class="random-result-box" style="display:none;"></div>
      </div>

      <!-- MAP PANEL (COLLAPSIBLE) -->
      <div class="collapse-panel" id="mapPanel">
        <div id="saigonMap"></div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container">
    <!-- FILTER BOX -->
    <section class="filter-box">
      <div class="filter-grid">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Tìm tên quán, món ăn (cơm tấm, phở, ốc, lẩu...), tên đường..." oninput="applyFilters()" />
        </div>

        <select id="categorySelect" class="filter-select" onchange="applyFilters()">
          <option value="all">Tất cả loại món</option>
          <option value="com-viet">Cơm tấm & Món Việt</option>
          <option value="mon-nuoc">Bún, Phở & Món nước</option>
          <option value="oc-hai-san">Ốc, Hải sản & Quán nhậu</option>
          <option value="lau-nuong">Lẩu & Nướng BBQ</option>
          <option value="chau-a">Nhật - Hàn - Thái - Hoa</option>
          <option value="nha-hang">Buffet & Nhà hàng</option>
          <option value="an-vat">Ăn vặt, Trà sữa & Cà phê</option>
          <option value="chay">Món Chay</option>
        </select>

        <select id="streetSelect" class="filter-select" onchange="setStreetFilter(this.value)">
          <option value="all">Tất cả tuyến đường</option>
          <option value="Vạn Kiếp - Trường Sa">Vạn Kiếp - Trường Sa</option>
          <option value="Khu D2 - D5">Khu D2 (Nguyễn Gia Trí) - D5</option>
          <option value="Phan Xích Long">Phố Phan Xích Long (PN)</option>
          <option value="Phan Văn Trị - Phạm Văn Đồng">Phan Văn Trị - Phạm Văn Đồng</option>
          <option value="Bà Chiểu - Bùi Đình Tuý">Bà Chiểu - Bùi Đình Tuý</option>
          <option value="Hậu Giang - Chợ Lớn - Phú Lâm">Hậu Giang - Chợ Lớn (Q.6)</option>
          <option value="Khu Tên Lửa - AEON Bình Tân">Khu Tên Lửa - AEON (Bình Tân)</option>
          <option value="Tân Sơn Nhì - Lũy Bán Bích">Tân Sơn Nhì - Lũy Bán Bích (Tân Phú)</option>
          <option value="Vinhomes - Landmark 81">Vinhomes - Landmark 81</option>
        </select>

        <select id="priceSelect" class="filter-select" onchange="applyFilters()">
          <option value="all">Mọi mức giá</option>
          <option value="binh-dan">Dưới 100.000đ</option>
          <option value="tam-trung">100.000đ – 350.000đ</option>
          <option value="cao-cap">Trên 350.000đ</option>
        </select>

        <select id="sortSelect" class="filter-select" onchange="applyFilters()">
          <option value="reviews-desc">Sắp xếp: Nhiều đánh giá</option>
          <option value="rating-desc">Sắp xếp: Điểm cao nhất</option>
          <option value="price-asc">Sắp xếp: Giá thấp → cao</option>
          <option value="price-desc">Sắp xếp: Giá cao → thấp</option>
        </select>
      </div>

      <!-- DISTRICT TABS -->
      <div class="district-tabs-row">
        <div class="district-tabs" id="districtPills">
          <button class="tab-btn active" data-district="all" onclick="setDistrictFilter('all')">Tất cả (341)</button>
          <button class="tab-btn" data-district="Bình Thạnh" onclick="setDistrictFilter('Bình Thạnh')">Bình Thạnh (79)</button>
          <button class="tab-btn" data-district="Phú Nhuận" onclick="setDistrictFilter('Phú Nhuận')">Phú Nhuận (67)</button>
          <button class="tab-btn" data-district="Quận 6" onclick="setDistrictFilter('Quận 6')">Quận 6 (50)</button>
          <button class="tab-btn" data-district="Bình Tân" onclick="setDistrictFilter('Bình Tân')">Bình Tân (46)</button>
          <button class="tab-btn" data-district="Gò Vấp" onclick="setDistrictFilter('Gò Vấp')">Gò Vấp (40)</button>
          <button class="tab-btn" data-district="Tân Phú" onclick="setDistrictFilter('Tân Phú')">Tân Phú (40)</button>
          <button class="tab-btn" data-district="Gần Bình Thạnh" onclick="setDistrictFilter('Gần Bình Thạnh')">Gần Bình Thạnh (19)</button>
        </div>

        <div class="results-meta">
          <span id="resultsCountText">341 quán</span>
          <button class="reset-link" onclick="resetAllFilters()">Đặt lại</button>
        </div>
      </div>
    </section>

    <!-- RESTAURANT CARDS -->
    <section class="cards-grid" id="cardsGrid"></section>
  </main>

  <!-- DETAIL MODAL -->
  <div class="modal-backdrop" id="detailModal" onclick="if(event.target===this) closeModal()">
    <div class="modal-dialog">
      <div class="modal-header">
        <strong id="modalTitle" style="font-size:16px;">Chi tiết quán ăn</strong>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- SIMPLE FOOTER -->
  <footer class="site-footer">
    <div class="container">
      Hôm Nay Ăn Gì? — Tổng hợp 341 quán ăn tại Bình Thạnh, Phú Nhuận, Gò Vấp, Quận 6, Bình Tân & Tân Phú ·
      <button class="reset-link" onclick="downloadCSV()">Tải danh sách Excel (CSV)</button>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script>
    let currentDistrict = "all";
    let currentStreet = "all";
    let mapInstance = null;
    let markersLayer = null;
    const markerById = {};

    function toggleRandomPanel() {
      const panel = document.getElementById("randomPanel");
      const btn = document.getElementById("btnToggleRandom");
      const isOpen = panel.classList.toggle("open");
      btn.classList.toggle("active", isOpen);
      if (isOpen && !document.getElementById("randomResult").innerHTML) {
        spinRandomRestaurant();
      }
    }

    function toggleMapPanel(forceOpen) {
      const panel = document.getElementById("mapPanel");
      const btn = document.getElementById("btnToggleMap");
      const isOpen = typeof forceOpen === "boolean" ? (panel.classList.toggle("open", forceOpen), forceOpen) : panel.classList.toggle("open");
      btn.classList.toggle("active", isOpen);
      if (isOpen) {
        if (!mapInstance) {
          initMap();
          applyFilters();
        } else {
          setTimeout(() => mapInstance.invalidateSize(), 100);
        }
      }
    }

    function initMap() {
      mapInstance = L.map("saigonMap", { scrollWheelZoom: false }).setView([10.8065, 106.6955], 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap"
      }).addTo(mapInstance);
      markersLayer = L.layerGroup().addTo(mapInstance);
    }

    function updateMapMarkers(list) {
      if (!markersLayer) return;
      markersLayer.clearLayers();
      const bounds = [];
      list.forEach(r => {
        const icon = L.divIcon({
          className: "custom-pin",
          html: `<div style="background:#0F172A;color:#fff;font-weight:700;font-size:11px;padding:2px 6px;border-radius:6px;border:1.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.25);white-space:nowrap;">${r.rating}★</div>`,
          iconSize: [40, 22],
          iconAnchor: [20, 11]
        });
        const marker = L.marker([r.lat, r.lng], { icon }).addTo(markersLayer);
        marker.bindPopup(`
          <div style="font-family:'Be Vietnam Pro',sans-serif;min-width:200px;">
            <div style="font-size:11px;color:#64748B;">${r.district} · ${r.subArea}</div>
            <div style="font-size:14px;font-weight:700;margin:2px 0 4px;">${r.name}</div>
            <div style="font-size:12px;color:#475569;margin-bottom:6px;">${r.address}</div>
            <div style="font-size:12px;font-weight:600;color:#047857;margin-bottom:8px;">${r.priceRange} · ★ ${r.rating}</div>
            <button onclick="openModal('${r.id}')" style="width:100%;padding:6px 10px;background:#0F172A;color:#fff;border:none;border-radius:6px;font-weight:600;font-size:12px;cursor:pointer;">Xem chi tiết</button>
          </div>
        `);
        markerById[r.id] = marker;
        bounds.push([r.lat, r.lng]);
      });
      if (bounds.length > 1) {
        mapInstance.fitBounds(bounds, { padding: [24, 24], maxZoom: 15 });
      } else if (bounds.length === 1) {
        mapInstance.setView(bounds[0], 16);
      }
    }

    function focusOnMap(id, ev) {
      if (ev) ev.stopPropagation();
      const r = RESTAURANTS.find(x => x.id === id);
      if (!r) return;
      toggleMapPanel(true);
      setTimeout(() => {
        document.getElementById("saigonMap").scrollIntoView({ behavior: "smooth", block: "center" });
        mapInstance.setView([r.lat, r.lng], 16, { animate: true });
        if (markerById[id]) markerById[id].openPopup();
      }, 120);
    }

    function setDistrictFilter(district) {
      currentDistrict = district;
      document.querySelectorAll("#districtPills .tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-district") === district);
      });
      applyFilters();
    }

    function setStreetFilter(street) {
      currentStreet = street;
      document.getElementById("streetSelect").value = street;
      applyFilters();
    }

    function resetAllFilters() {
      document.getElementById("searchInput").value = "";
      document.getElementById("categorySelect").value = "all";
      document.getElementById("streetSelect").value = "all";
      document.getElementById("priceSelect").value = "all";
      document.getElementById("sortSelect").value = "reviews-desc";
      currentStreet = "all";
      setDistrictFilter("all");
    }

    function applyFilters() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const cat = document.getElementById("categorySelect").value;
      const price = document.getElementById("priceSelect").value;
      const sort = document.getElementById("sortSelect").value;

      const filtered = RESTAURANTS.filter(r => {
        if (currentDistrict !== "all" && r.district !== currentDistrict) return false;
        if (currentStreet !== "all" && r.streetTag !== currentStreet) return false;
        if (cat !== "all" && r.categoryKey !== cat) return false;
        if (price !== "all" && r.priceTier !== price) return false;
        if (q) {
          const hay = [
            r.name, r.district, r.subArea, r.address, r.category,
            ...(r.signatureDishes || []), ...(r.highlights || [])
          ].join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      filtered.sort((a, b) => {
        if (sort === "reviews-desc") return b.reviewCount - a.reviewCount;
        if (sort === "rating-desc") return b.rating - a.rating || b.reviewCount - a.reviewCount;
        if (sort === "price-asc") return a.minPrice - b.minPrice;
        if (sort === "price-desc") return b.maxPrice - a.maxPrice;
        return 0;
      });

      document.getElementById("resultsCountText").textContent = `${filtered.length} quán`;
      renderCards(filtered);
      if (mapInstance) updateMapMarkers(filtered);
    }

    function renderCards(list) {
      const grid = document.getElementById("cardsGrid");
      if (!list.length) {
        grid.innerHTML = `
          <div style="grid-column:1/-1;background:#fff;padding:40px 20px;border-radius:12px;text-align:center;border:1px solid var(--border);">
            <p style="font-weight:600;margin-bottom:6px;">Không tìm thấy quán phù hợp</p>
            <p style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Hãy thử đổi từ khóa hoặc đặt lại bộ lọc.</p>
            <button class="btn-solid" onclick="resetAllFilters()">Đặt lại bộ lọc</button>
          </div>
        `;
        return;
      }

      grid.innerHTML = list.map(r => {
        const dishes = (r.signatureDishes || []).slice(0, 3).map(d => `<span class="dish-pill">${d}</span>`).join("");
        const cleanPrice = (r.priceRange || "").replace(/\s*\([^)]*\)/g, "");
        const goods = (r.reviews || []).filter(x => x.type === "good");
        const bads = (r.reviews || []).filter(x => x.type === "bad");
        const firstGood = goods[0] ? goods[0].text : "";
        const firstBad = bads[0] ? bads[0].text : "";
        return `
          <article class="rest-card" onclick="openModal('${r.id}')">
            <div class="card-thumb">
              <img src="${r.image}" alt="${r.name}" loading="lazy" onerror="this.src='evidence/cua-gmaps-binhthanh.png'" />
              <span class="card-badge-area">${r.district}</span>
              <span class="card-badge-rating"><span class="star">★</span> ${r.rating.toFixed(1)} <small>(${r.reviewCount.toLocaleString("vi-VN")})</small></span>
            </div>
            <div class="card-content">
              <h3 class="card-title">${r.name}</h3>
              <div class="card-subline">
                <span>${r.category}</span>
                <span>·</span>
                <span class="card-price">${cleanPrice}</span>
              </div>
              <div class="card-info">
                <div class="card-info-row">
                  <span>📍</span>
                  <span>${r.address}</span>
                </div>
                <div class="card-info-row">
                  <span>🕒</span>
                  <span>${r.hours}</span>
                </div>
              </div>
              <div class="card-dishes">${dishes}</div>
              <div class="card-review-summary">
                <div class="card-rv-line"><strong>👍 Khen (${goods.length}):</strong> ${firstGood}</div>
                <div class="card-rv-line"><strong>👎 Chê (${bads.length}):</strong> ${firstBad}</div>
              </div>
              <div class="card-footer">
                <button class="btn-card" onclick="event.stopPropagation();openModal('${r.id}')">Xem ${goods.length} khen & ${bads.length} chê →</button>
                <button class="btn-card-secondary" onclick="focusOnMap('${r.id}', event)">Bản đồ</button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function openModal(id) {
      const r = RESTAURANTS.find(x => x.id === id);
      if (!r) return;
      document.getElementById("modalTitle").textContent = r.name;
      const modalBody = document.getElementById("modalBody");
      const goods = (r.reviews || []).filter(x => x.type === "good");
      const bads = (r.reviews || []).filter(x => x.type === "bad");

      modalBody.innerHTML = `
        <div style="display:grid;grid-template-columns:220px 1fr;gap:18px;margin-bottom:18px;">
          <img src="${r.image}" alt="${r.name}" style="width:100%;height:165px;object-fit:cover;border-radius:10px;border:1px solid var(--border);" onerror="this.src='evidence/cua-gmaps-binhthanh.png'" />
          <div style="font-size:13.5px;display:flex;flex-direction:column;gap:6px;">
            <div>
              <span style="background:var(--surface-muted);padding:3px 8px;border-radius:5px;font-size:12px;font-weight:600;">${r.district} · ${r.subArea}</span>
              <span style="background:var(--surface-muted);padding:3px 8px;border-radius:5px;font-size:12px;margin-left:4px;">${r.category}</span>
            </div>
            <div><strong>Địa chỉ:</strong> ${r.address}</div>
            <div><strong>Mức giá:</strong> <span style="color:var(--price);font-weight:600;">${r.priceRange}</span> ${r.priceNote ? `<span style="color:var(--text-muted);font-size:12.5px;">(${r.priceNote})</span>` : ""}</div>
            <div><strong>Đánh giá:</strong> <span style="color:var(--star);font-weight:700;">★ ${r.rating}</span> (${r.reviewCount.toLocaleString("vi-VN")} lượt trên Google Maps, TikTok, FB, Threads & Foody)</div>
            <div><strong>Giờ mở cửa:</strong> ${r.hours}</div>
            <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;">
              <a href="${r.url}" target="_blank" rel="noopener" class="btn-solid" style="padding:6px 12px;font-size:12.5px;">Mở trên ${r.source} ↗</a>
              <button class="btn-outline" style="padding:6px 12px;font-size:12.5px;" onclick="closeModal();focusOnMap('${r.id}')">Xem trên bản đồ</button>
            </div>
          </div>
        </div>

        <div style="background:var(--surface-muted);padding:14px;border-radius:10px;margin-bottom:18px;font-size:13.5px;">
          <div style="font-weight:600;margin-bottom:6px;">Món đặc sắc & Điểm nổi bật</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">
            ${(r.signatureDishes || []).map(d => `<span style="background:#fff;border:1px solid var(--border);padding:3px 9px;border-radius:5px;font-size:12px;">${d}</span>`).join("")}
          </div>
          <ul style="padding-left:18px;color:var(--text-secondary);font-size:13px;">
            ${(r.highlights || []).map(h => `<li style="margin-bottom:3px;">${h}</li>`).join("")}
          </ul>
        </div>

        <div class="reviews-two-col">
          <div>
            <div class="rv-col-title">
              <span style="color:#15803D;">👍 ${goods.length} Đánh giá tốt (Khen)</span>
              <span style="font-size:11.5px;font-weight:500;color:var(--text-muted);">Đa nền tảng MXH</span>
            </div>
            ${goods.map(rv => `
              <div class="review-item">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;font-weight:600;margin-bottom:5px;color:var(--text-secondary);flex-wrap:wrap;">
                  <span>${rv.author} · <span style="color:var(--star);">★ ${rv.rating}</span></span>
                  <span class="plat-tag">${rv.platform || "Google Maps"}</span>
                </div>
                <div style="font-size:13px;color:var(--text);">"${rv.text}"</div>
              </div>
            `).join("")}
          </div>

          <div>
            <div class="rv-col-title">
              <span style="color:#B91C1C;">👎 ${bads.length} Đánh giá xấu / Lưu ý</span>
              <span style="font-size:11.5px;font-weight:500;color:var(--text-muted);">Góc khuất thực tế</span>
            </div>
            ${bads.map(rv => `
              <div class="review-item bad">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;font-weight:600;margin-bottom:5px;color:var(--text-secondary);flex-wrap:wrap;">
                  <span>${rv.author} · <span style="color:#B91C1C;">★ ${rv.rating}</span></span>
                  <span class="plat-tag">${rv.platform || "Google Maps"}</span>
                </div>
                <div style="font-size:13px;color:var(--text);">"${rv.text}"</div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
      document.getElementById("detailModal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("detailModal").classList.remove("open");
    }

    function spinRandomRestaurant() {
      const area = document.getElementById("randArea").value;
      const budget = document.getElementById("randBudget").value;
      const pool = RESTAURANTS.filter(r => {
        if (area !== "all" && r.district !== area) return false;
        if (budget !== "all" && r.priceTier !== budget) return false;
        return true;
      });
      const box = document.getElementById("randomResult");
      box.style.display = "flex";
      if (!pool.length) {
        box.innerHTML = `<span>Không có quán phù hợp với mức giá này.</span>`;
        return;
      }
      const winner = pool[Math.floor(Math.random() * pool.length)];
      box.innerHTML = `
        <div>
          <div style="font-weight:700;font-size:14.5px;">🎯 Gợi ý: ${winner.name} <span style="color:var(--star);">★ ${winner.rating}</span></div>
          <div style="font-size:12.5px;color:var(--text-secondary);margin-top:2px;">${winner.district} (${winner.subArea}) · ${winner.address} · <strong style="color:var(--price);">${winner.priceRange}</strong></div>
        </div>
        <button class="btn-solid" style="padding:6px 12px;font-size:12.5px;" onclick="openModal('${winner.id}')">Xem quán này →</button>
      `;
    }

    function downloadCSV() {
      const headers = ["ID", "Tên quán", "Khu vực", "Phân khu", "Địa chỉ", "Danh mục", "Đánh giá", "Số review", "Mức giá", "Giờ mở cửa", "Món đặc sắc", "Nguồn", "URL"];
      const rows = RESTAURANTS.map(r => [
        r.id, r.name, r.district, r.subArea, r.address, r.category,
        r.rating, r.reviewCount, r.priceRange, r.hours,
        (r.signatureDishes || []).join("; "), r.source, r.url
      ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(","));
      const csv = "\uFEFF" + [headers.join(","), ...rows].join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "hom-nay-an-gi-saigon.csv";
      a.click();
    }

    window.addEventListener("DOMContentLoaded", () => {
      applyFilters();
    });
  </script>
</body>
</html>
